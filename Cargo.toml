[workspace]
members = [
    "contracts/token",
    "contracts/factory",
    "contracts/bonding-curve",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/forgex/forgex"

[workspace.dependencies]
soroban-sdk = "27.0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true