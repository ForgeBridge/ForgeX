[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
