name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/sdk/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/sdk/**'
      - 'package.json'

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck SDK
        run: npm run typecheck -w packages/sdk
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build:web
