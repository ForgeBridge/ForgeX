name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Build
        run: cargo build --release -p forgex-token -p forgex-factory -p forgex-bonding-curve
      - name: Build WASM (embedded by factory tests)
        run: |
          rustup target add wasm32v1-none
          ./scripts/build-contracts.sh
      - name: Test
        run: cargo test --lib -p forgex-token -p forgex-factory -p forgex-bonding-curve
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all --check
